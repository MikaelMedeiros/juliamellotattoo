<button
  type="button"
  (click)="onClick()"
  class="card group"
>
  <div
    class="background"
    [style.background-image]="'url(' + image + ')'"
  ></div>

  <div class="overlay"></div>

  <div class="content">

    <div class="info">

      <div class="icon">
        <i [class]="'pi ' + icon"></i>
      </div>

      <h2 class="title">
        {{ title }}
      </h2>

      <p class="description">
        {{ description }}
      </p>

    </div>

    <i class="pi pi-angle-right arrow"></i>

  </div>
</button>
