<div class="align-cards">
    <p-card [style]="{ width: '20rem', overflow: 'hidden' }">
        <p-tabs value="1">
            <p-tablist>
                <p-tab value="1">                
                    <i class="pi pi-calculator"></i>
                </p-tab>
                <p-tab value="2">                
                    <i class="pi pi-cog"></i>
                </p-tab>
                <p-tab *ngIf="showAdditionBudgetTab()" value="addition">
                    <i class="pi pi-arrow-up"></i>
                    <i class="pi pi-dollar"></i>
                </p-tab>           
            </p-tablist>    
            <p-tabpanels>
                <p-tabpanel value="1">            
                    <form [formGroup]="budgetForm" (ngSubmit)="generateBudget()">
        
                        <div class="field" >
                            <label for="client" class="block">Nome do cliente</label>
                            <input type="text" id="client" (keyup)="generateBudget()" pInputText formControlName="client"/>
                            <small class="p-error block" *ngIf="budgetForm.get('client')?.invalid && budgetForm.get('client')?.dirty">Preencha o nome do cliente</small>
                        </div>
        
                        <div class="mt-3" >
                            <label for="cm" class="block">{{labelCalcType}}</label>
                            <p-inputNumber inputId="cm" (onInput)="generateBudget()" formControlName="cm" [suffix]="suffixCalcType" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2" [showButtons]="true" [min]="1"> </p-inputNumber>
                            <small class="p-error block" *ngIf="budgetForm.get('cm')?.invalid && budgetForm.get('cm')?.dirty">Preencha o tamanho</small>
                        </div>
        
                        <div class="mt-3" >
                            <label for="draw" class="block">Desenho</label>
                            <input type="text" id="draw" (onInput)="generateBudget()" pInputText formControlName="draw"/>
                            <small class="p-error block" *ngIf="budgetForm.get('draw')?.invalid && budgetForm.get('draw')?.dirty">Preencha o desenho</small>
                        </div>
        
                        <div class="mt-3">
                            <p-multiSelect id="style" (onChange)="generateBudget()" [options]="styles" formControlName="style" [filter]="false" optionLabel="name" placeholder="Categorias"></p-multiSelect>
                            <small class="p-error block" *ngIf="budgetForm.get('style')?.invalid && budgetForm.get('style')?.dirty">Preencha o(s) estilo(s)</small>
                        </div>
    
                        <div class="mt-3" >
                            <p-multiSelect id="details" (onChange)="generateBudget()" [options]="details" formControlName="details" [filter]="false" optionLabel="name" placeholder="Detalhes"></p-multiSelect>
                        </div>
    
                        <div class="mt-3" >
                            <p-select id="bodyLocal" (onChange)="generateBudget()" [options]="bodyLocal" formControlName="bodyLocal" optionLabel="name" [showClear]="true" placeholder="Local do corpo"></p-select>
                        </div>
        
                        <div class="flex items-center gap-2 mt-3">
                            <p-button
                                severity="help"
                                type="submit"
                                accessKey="enter"
                                icon="pi pi-calculator"
                                [disabled]="budgetForm.invalid">
                            </p-button>
        
                            <p-button
                                type="button"
                                icon="pi pi-eraser"
                                severity="info"
                                (onClick)="resetForm()">
                            </p-button>
        
                            <p-button
                                *ngIf="true"
                                icon="pi pi-copy"
                                severity="help"
                                title="Copiar texto"
                                (click)="copyText()">
                            </p-button>
                        </div>
                    </form>
                </p-tabpanel>
            
                <p-tabpanel value="2">        
                    <form [formGroup]="configForm" (ngSubmit)="generateBudget()">
                        <div class="field" >
                        <label for="valorcm" class="block">Preço por {{labelCalcType.toLowerCase()}}</label>
                        <p-inputNumber inputId="valorcm" (onInput)="generateBudget()" formControlName="valorcm" mode="currency" currency="BRL" locale="pt-BR" [showButtons]="true" [min]="1" [step]="0.5"> </p-inputNumber>
                        <small class="p-error block" *ngIf="configForm.get('valorcm')?.invalid && configForm.get('valorcm')?.dirty">Preencha o preço por centímetro</small>
                        </div>
        
                        <div class="mt-3" >
                        <div class="formgroup-inline">
                            <label for="percentageTax" class="block">Porcentagem do studio</label>
                            <i class="pi pi-info-circle" (click)="showHint($event, 'percentageTax')" style="font-size: 0.8rem; color: #b19df7"></i>
                        </div>
                        <p-inputNumber (onInput)="generateBudget()" inputId="percentageTax" suffix="%" formControlName="percentageTax" [showButtons]="true"> </p-inputNumber>
                        </div>
        
                        <div class="mt-3" >
                        <div class="formgroup-inline">
                            <label for="parkingPrice" class="block">Transporte</label>
                            <i class="pi pi-info-circle" (click)="showHint($event, 'transport')" style="font-size: 0.8rem; color: #b19df7"></i>
                        </div>
                        <p-inputNumber (onInput)="generateBudget()" formControlName="parkingPrice" inputId="parkingPrice" mode="currency" currency="BRL" locale="pt-BR" [showButtons]="true" [min]="0" [step]="0.5"> </p-inputNumber>
                        </div>
        
                        <div class="mt-3" >
                        <label for="creditTax" class="block">Acréscimo do cartão de crédito</label>
                        <p-inputNumber (onInput)="generateBudget()" formControlName="creditTax" inputId="creditTax" mode="currency" currency="BRL" locale="pt-BR" [showButtons]="true" [min]="0" [step]="0.5"> </p-inputNumber>
                        </div>
        
                        <div class="mt-3" >
                            <p-select id="maxInstallments" (onChange)="generateBudget()" [options]="maxInstallments" formControlName="maxInstallments" optionLabel="name" optionValue="value" [showClear]="true" placeholder="Máx. de parcelas"></p-select>                    
                        </div>
        
                        <div class="mt-3" >
                            <label for="materials" class="block">Materiais</label>
                            <p-inputNumber (onInput)="generateBudget()" formControlName="materials" inputId="materials" mode="currency" currency="BRL" locale="pt-BR" [showButtons]="true" [min]="0" [step]="0.5"> </p-inputNumber>
                        </div>
        
                        <div class="mt-3" >
                            <label for="validity" class="block">Validade do orçamento (dias)</label>
                            <p-inputNumber (onInput)="generateBudget()" formControlName="validity" inputId="validity"  [showButtons]="true" [min]="1" [step]="1"> </p-inputNumber>
                        </div>
                    </form>
                </p-tabpanel>   
                    
                <!-- <p-tabpanel *ngIf="showAdditionBudgetTab()" value="addition">
                    <form [formGroup]="additionPriceForm">
        
                        <div class="field" *ngFor="let item of fieldsAddition" >
                        <label for={{item.for}} class="block">{{item.label}}</label>
                        <p-inputNumber  class="w-full" (onInput)="handleAddition($event.value, item.for)" formControlName={{item.formControlName}} inputId={{item.inputId}} suffix="%" [min]="0" [max]="100" [step]="0.5"> </p-inputNumber>          
                        </div>       
                    </form>   
                </p-tabpanel>      -->
            </p-tabpanels>
        </p-tabs>
        
        @if(showBudgetValues()) {
            <div class="flex flex-wrap">
              <div class="formgroup-inline">
                <div class="pr-2">
                  <i class="pi pi-wallet" style="font-size: 1rem; color: #93deac"></i>
                </div>
                <label style="color: #93deac" class="block"> R${{netValue.toFixed(2)}}</label>
              </div>
          
              <div class="pl-3">
                <div class="formgroup-inline">
                  <div class="pr-2">
                    <i class="pi pi-percentage" style="font-size: 1rem; color: #de9393"></i>
                  </div>
                  <label style="color: #de9393" class="block"> R${{studioPercent.toFixed(2)}}</label>
                </div>
              </div>
          
              <div class="pl-3">
                <div class="formgroup-inline">
                  <div class="pr-2">
                    <i class="pi pi-palette" style="font-size: 1rem; color: #93bade"></i>
                  </div>
                  <label style="color: #93bade" class="block"> R${{(netValue + studioPercent).toFixed(2)}}</label>
                </div>
              </div>
          
              <div class="mt-3">
                <textarea id="generatedBudget" [(ngModel)]="generatedBudget" rows="5" cols="30" pTextarea [autoResize]="true"></textarea>
              </div>
            </div>
        }  
          
          <p-dialog header="Dica" [modal]="true" [closable]="true" position="bottom" [(visible)]="hintVisible" [style]="{width: '90vw'}">
            <p>
                {{hintText}}
            </p>
          </p-dialog> 
    </p-card>
</div>
